<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>치이카와 머리 잘라주기</title>
  <meta name="description" content="가위, 바리깡, 손으로 치이카와의 덥수룩한 털을 정리해 주세요.">
  <meta name="theme-color" content="#fff7ec">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>치이카와 머리 잘라주기</h1>
      <button id="mute" class="icon-btn" type="button" aria-label="소리 끄기" aria-pressed="false">🔊</button>
    </header>

    <section class="stage-wrap">
      <div id="stage" class="stage">
        <div class="character">
          <div id="rig" class="rig">
            <canvas id="cut" width="1024" height="1024"></canvas>
            <canvas id="hair" width="1024" height="1024"></canvas>
            <img id="face" alt="" draggable="false">
          </div>
        </div>
        <div id="cursor" class="tool-cursor" aria-hidden="true"></div>
      </div>
    </section>

    <nav class="tools" role="radiogroup" aria-label="도구">
      <button class="tool" type="button" role="radio" data-tool="scissors" aria-checked="true"><span class="ico"></span><span>가위</span></button>
      <button class="tool" type="button" role="radio" data-tool="clipper" aria-checked="false"><span class="ico"></span><span>바리깡</span></button>
      <button class="tool" type="button" role="radio" data-tool="hand" aria-checked="false"><span class="ico"></span><span>손</span></button>
    </nav>

    <div class="actions">
      <button id="reset" class="btn ghost" type="button">처음부터 다시하기</button>
      <button id="finish" class="btn primary" type="button">완성!</button>
    </div>

    <div class="done-panel" role="status">
      <p class="done-title">완성! ✨</p>
      <p class="done-text">치이카와가 말끔해졌어요.</p>
      <button id="again" class="btn primary" type="button">한 번 더 하기</button>
    </div>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>

  <div id="intro" class="overlay show">
    <div class="intro-card">
      <h2>치이카와 머리 잘라주기</h2>
      <p>털이 너무 자라서 울고 있어요.<br>깔끔하게 다듬어 주세요!</p>
      <ul class="howto">
        <li><span class="mini" data-icon="scissors"></span>가위: 조금씩 꼼꼼하게</li>
        <li><span class="mini" data-icon="clipper"></span>바리깡: 넓게 슝슝</li>
        <li><span class="mini" data-icon="hand"></span>손: 쓰다듬어 달래주기</li>
      </ul>
      <p class="hint">PC는 마우스를 올려서 움직이고,<br>휴대폰은 손가락으로 문질러요.</p>
      <button id="start" class="btn primary big" type="button">시작하기</button>
      <p class="fine">팬이 만든 비공식 게임이에요.</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
